services:
    web:
        image: nginx
        volumes:
            - ./docker/conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/html
            - /etc/letsencrypt:/etc/letsencrypt:ro
        ports:
            - '${LOCAL_PORT:-80}:80'
            - '443:443'
        restart: always
        depends_on:
            - php-fpm
            - db

    php-fpm:
        build: docker
        restart: always
        volumes:
            - .:/var/www/html
            - /var/www/certs:/var/www/certs
        env_file:
            - .env
        ports:
            - '${VITE_PORT:-5173}:5173'
            - '${RABBITMQ_PORT:-5672}:5672'
        depends_on:
            - db
            - rabbitmq

    queue-worker:
        build: docker
        restart: always
        volumes:
            - .:/var/www/html
        env_file:
            - .env
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        depends_on:
            - php-fpm
            - rabbitmq
            - db

    db:
        image: postgres:18.6
        volumes:
            - ./docker/postgres/data:/var/lib/postgresql
        restart: always
        environment:
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - '${DB_PORT:-5432}:5432'

    rabbitmq:
        image: rabbitmq:3.12.7-management
        hostname: rabbitmq
        restart: always
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-user}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-user}
        ports:
            - '${RABBITMQ_ADMIN_PORT:-15672}:15672'
